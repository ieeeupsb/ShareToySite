<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>QR Image</title>
<style>
  html, body { margin: 0; height: 100%; background: #111; color: #eee; font-family: system-ui, sans-serif; }
  body { display: flex; align-items: center; justify-content: center; }
  img { max-width: 100vw; max-height: 100vh; image-rendering: auto; }
  p { padding: 16px; text-align: center; }
</style>
</head>
<body>
<p id="msg">No image in this link.</p>
<script>
  // Fragment format: #<fmt>;<base64>   e.g. #webp;UklGR...
  // The fragment is never sent to a server.
  const h = location.hash.slice(1);
  const i = h.indexOf(";");
  const fmt = h.slice(0, i);
  if (i > 0 && /^(webp|jpeg|png)$/.test(fmt)) {
    const img = new Image();
    img.onload = () => { document.getElementById("msg").remove(); document.body.appendChild(img); };
    img.onerror = () => { document.getElementById("msg").textContent = "Could not read image."; };
    img.src = "data:image/" + fmt + ";base64," + h.slice(i + 1);
  }
</script>
</body>
</html>
